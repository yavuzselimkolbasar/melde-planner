[package]
name = "uniffi-bindgen"
description = "Pinned UniFFI bindings generator, so generated Swift always matches the uniffi runtime version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
