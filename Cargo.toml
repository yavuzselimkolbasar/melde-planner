[workspace]
resolver = "3"
members = [
    "crates/melde-core",
    "crates/melde-grades",
    "crates/melde-scheduling",
    "crates/melde-statistics",
    "crates/melde-tasks",
    "crates/melde-ffi",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
melde-core = { path = "crates/melde-core" }
melde-grades = { path = "crates/melde-grades" }
melde-scheduling = { path = "crates/melde-scheduling" }
melde-statistics = { path = "crates/melde-statistics" }
melde-tasks = { path = "crates/melde-tasks" }
# Calendar math (ISO weeks, weekdays). `std` only: no clock or timezone database,
# the app passes local wall-clock values in. Keeps the crates wasm-friendly for the PWA.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
thiserror = "2.0.21"
uniffi = "0.32.2"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_cmp = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
