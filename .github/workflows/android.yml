name: Android

on:
  push:
    branches: [main]
    paths: [apps/android/**, crates/**, tools/**, Cargo.lock, apps/ios/MeldePlanner/Resources/Localizable.xcstrings, .github/workflows/android.yml]
  pull_request:
    paths: [apps/android/**, crates/**, tools/**, Cargo.lock, apps/ios/MeldePlanner/Resources/Localizable.xcstrings, .github/workflows/android.yml]
  workflow_dispatch:
  # Also run by release.yml, which publishes the build as a GitHub Release.
  workflow_call:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - run: ./gradlew --console=plain testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: meldo-android-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: apps/android/app/build/reports/tests
