# Walks through the app like a student on an iPhone and an iPad simulator and
# exports a screenshot of every step for review. Started by hand because macOS
# minutes are limited on a private repository.
name: UI review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-review:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: PROFILE=debug bash scripts/build-rust-ios.sh
      - run: brew install xcodegen xcbeautify
      - working-directory: apps/ios
        run: xcodegen generate

      - name: Pick an iPhone and an iPad simulator
        id: sim
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), reverse=True)
          def pick(prefix, prefer):
              for r in runtimes:
                  devices = [d for d in data[r] if d["name"].startswith(prefix)]
                  for name in prefer:
                      for d in devices:
                          if name in d["name"]:
                              return d["udid"]
                  if devices:
                      return devices[0]["udid"]
          print("iphone=" + pick("iPhone", ["Pro Max", "Pro"]))
          print("ipad=" + pick("iPad", ["Pro 13", "Pro (13", "Pro"]))
          EOF

      - name: Run UI tests on iPhone and iPad
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test -project MeldePlanner.xcodeproj -scheme MeldePlanner \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.ipad }}" \
            -only-testing:MeldePlannerUITests \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || echo "::warning::some UI steps failed; screenshots are still exported"

      - name: List failed steps
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ui.xcresult" --format json > "$RUNNER_TEMP/tests.json" || exit 0
          python3 - "$RUNNER_TEMP/tests.json" <<'EOF'
          import json, sys
          def walk(node, path):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print("::warning::" + " / ".join(path) + ": " + name)
              for child in node.get("children", []):
                  walk(child, path + [name] if node.get("nodeType") in ("Test Case", "Device") else path)
          for node in json.load(open(sys.argv[1])).get("testNodes", []):
              walk(node, [])
          EOF

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/screens"
          ls "$RUNNER_TEMP/screens" | head -100

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-screens
          path: ${{ runner.temp }}/screens
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-xcresult
          path: ${{ runner.temp }}/ui.xcresult
          retention-days: 7
