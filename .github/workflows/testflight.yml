# Manual TestFlight upload. Needs these repository secrets (see vault "Windows Dev Workflow"):
#   APPLE_TEAM_ID              10-character Apple Developer team id
#   ASC_KEY_ID                 App Store Connect API key id
#   ASC_ISSUER_ID              App Store Connect issuer id
#   ASC_PRIVATE_KEY_BASE64     base64 of the AuthKey_XXXX.p8 file (Admin role, for cloud signing)
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      MELDE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-rust-ios.sh
      - run: brew install xcodegen
      - working-directory: apps/ios
        run: xcodegen generate

      - name: Write App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (cloud-managed signing)
        working-directory: apps/ios
        run: |
          xcodebuild archive -project MeldePlanner.xcodeproj -scheme MeldePlanner \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/MeldePlanner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${MELDE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MeldePlanner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
