name: iOS

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/ios/**"
      - "crates/**"
      - "tools/**"
      - "Cargo.*"
      - "scripts/build-rust-ios.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build-and-test:
    name: Build and test (simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust core XCFramework and Swift bindings
        run: PROFILE=debug scripts/build-rust-ios.sh

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), reverse=True)
          for r in runtimes:
              for d in data[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator available")')
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"

      - name: Test MeldeCore package (Rust through UniFFI)
        working-directory: apps/ios/MeldeCore
        run: |
          xcodebuild test -scheme MeldeCore \
            -destination "${{ steps.sim.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/MeldeCore.xcresult" | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Build and test app
        working-directory: apps/ios
        run: |
          xcodebuild test -project MeldePlanner.xcodeproj -scheme MeldePlanner \
            -destination "${{ steps.sim.outputs.destination }}" \
            -resultBundlePath "$RUNNER_TEMP/MeldePlanner.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7
